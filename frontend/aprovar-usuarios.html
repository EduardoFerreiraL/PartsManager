<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários - Gerenciador de Peças</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="user-menu.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                        secondary: { 50: '#f8fafc', 100: '#f1f5f9', 500: '#64748b', 600: '#475569' }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen text-gray-800 relative">
    <div class="fixed inset-0 z-0">
        <img src="imagens/fundoDb.jpg" alt="" class="w-full h-full object-cover"
             onerror="this.style.display='none'; this.nextElementSibling.style.background='linear-gradient(135deg, #1e3a8a, #3730a3, #581c87)'">
        <div class="absolute inset-0 bg-black bg-opacity-60"></div>
    </div>

    <nav class="bg-white/10 backdrop-blur-md border-b border-white/20 sticky top-0 z-50">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-4">
                    <a href="/" class="flex items-center space-x-4">
                        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                            <i class="fas fa-cogs text-white text-lg"></i>
                        </div>
                        <h1 class="text-xl font-bold text-white hidden sm:block">Gerenciador de Peças</h1>
                    </a>
                </div>
                <div class="flex items-center space-x-2">
                    <a href="/" class="flex items-center px-4 py-2 rounded-lg transition-all duration-300 hover:bg-white/20 text-white">
                        <i class="fas fa-arrow-left mr-2"></i> Voltar
                    </a>
                    <div id="user-menu-root" class="flex items-center ml-2"></div>
                </div>
            </div>
        </div>
    </nav>

    <div class="relative z-10 container mx-auto px-4 py-8">
        <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl shadow-xl p-6 md:p-8">
            <h2 class="text-xl font-bold text-white mb-2 flex items-center gap-2">
                <i class="fas fa-users-cog"></i> Gerenciar Usuários
            </h2>
            <p class="text-white/80 text-sm mb-6">Gerencie usuários cadastrados, níveis de permissão e exclusões com segurança.</p>

            <div id="message" class="hidden mb-4 p-3 rounded-lg text-sm"></div>
            <div id="loading" class="text-white/80 py-4">Carregando...</div>
            <div id="listaContainer" class="hidden overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="border-b border-white/20 text-white/90 text-sm">
                            <th class="py-3 pr-4">Nome</th>
                            <th class="py-3 pr-4">E-mail</th>
                            <th class="py-3 pr-4">Status</th>
                            <th class="py-3 pr-4">Nível de permissão</th>
                            <th class="py-3 pr-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaBody" class="text-white/90"></tbody>
                </table>
                <p id="emptyMsg" class="hidden py-6 text-white/70 text-center">Nenhum usuário encontrado.</p>
            </div>
        </div>
    </div>

    <style>
        /* Garante contraste legivel no dropdown de permissao sem depender de hover */
        .nivel-select {
            background-color: rgba(15, 23, 42, 0.75);
            color: #f8fafc;
            border-color: rgba(148, 163, 184, 0.5);
        }
        .nivel-select option {
            background-color: #0f172a;
            color: #f8fafc;
        }
        .nivel-select option:disabled {
            color: #94a3b8;
        }
    </style>

    <script>
        (function() {
            const base = window.API_BASE_URL || '/api';
            const headers = function() {
                const h = { 'Content-Type': 'application/json' };
                const t = window.auth && window.auth.getToken();
                if (t) h['Authorization'] = 'Bearer ' + t;
                return h;
            };
            let currentUser = null;

            function showMessage(msg, isError) {
                const el = document.getElementById('message');
                el.textContent = msg;
                el.className = 'mb-4 p-3 rounded-lg text-sm ' + (isError ? 'bg-red-500/20 border border-red-400/50 text-red-200' : 'bg-green-500/20 border border-green-400/50 text-green-200');
                el.classList.remove('hidden');
                setTimeout(function() { el.classList.add('hidden'); }, 5000);
            }

            function nivelLabel(n) {
                if (n === 0) return '0 - Máxima';
                if (n === 1) return '1 - Alta';
                if (n === 2) return '2 - Média';
                if (n === 3) return '3 - Baixa';
                return 'Pendente';
            }

            function statusLabel(nivel) {
                return nivel === null || nivel === undefined ? 'Pendente' : 'Aprovado';
            }

            function canSetLevel(actorLevel, targetLevel, candidateLevel) {
                if (actorLevel === 0) return true;
                if (actorLevel !== 1) return false;
                if (candidateLevel === 0 || candidateLevel === 1) return false;
                if (targetLevel === null || targetLevel === undefined) return true; // aprovação pendente
                return targetLevel === 2 || targetLevel === 3; // alteração só entre 2 e 3
            }

            function buildLevelSelect(user) {
                let html = '<select class="nivel-select bg-white/10 border border-white/20 text-white rounded px-2 py-1 text-sm">';
                for (let n = 0; n <= 3; n++) {
                    const disabled = canSetLevel(currentUser.nivelPermissao, user.nivelPermissao, n) ? '' : ' disabled';
                    const selected = user.nivelPermissao === null || user.nivelPermissao === undefined
                        ? (n === 2 ? ' selected' : '')
                        : (n === user.nivelPermissao ? ' selected' : '');
                    html += '<option value="' + n + '"' + selected + disabled + '>' + nivelLabel(n) + '</option>';
                }
                html += '</select>';
                return html;
            }

            function actionButtons(user) {
                if (user.nivelPermissao === null || user.nivelPermissao === undefined) {
                    return '<button type="button" class="btn-aprovar px-3 py-1 bg-primary-500 hover:bg-primary-600 text-white text-sm rounded-lg">Aprovar</button>' +
                        ' <button type="button" class="btn-excluir px-3 py-1 bg-red-500 hover:bg-red-600 text-white text-sm rounded-lg">Excluir</button>';
                }
                return '<button type="button" class="btn-salvar px-3 py-1 bg-emerald-500 hover:bg-emerald-600 text-white text-sm rounded-lg">Salvar nível</button>' +
                    ' <button type="button" class="btn-excluir px-3 py-1 bg-red-500 hover:bg-red-600 text-white text-sm rounded-lg">Excluir</button>';
            }

            function rowHtml(user) {
                return '<td class="py-3 pr-4">' + (user.nome || '-') + '</td>' +
                    '<td class="py-3 pr-4">' + (user.email || '-') + '</td>' +
                    '<td class="py-3 pr-4">' + statusLabel(user.nivelPermissao) + '</td>' +
                    '<td class="py-3 pr-4">' + buildLevelSelect(user) + '</td>' +
                    '<td class="py-3">' + actionButtons(user) + '</td>';
            }

            async function loadUsuarios() {
                document.getElementById('loading').classList.remove('hidden');
                document.getElementById('listaContainer').classList.add('hidden');
                try {
                    const res = await fetch(base + '/auth/usuarios', { headers: headers() });
                    if (res.status === 401 || res.status === 403) {
                        window.location.href = '/login';
                        return;
                    }
                    const list = await res.json();
                    const container = document.getElementById('listaContainer');
                    const tbody = document.getElementById('listaBody');
                    const emptyMsg = document.getElementById('emptyMsg');

                    document.getElementById('loading').classList.add('hidden');
                    container.classList.remove('hidden');
                    tbody.innerHTML = '';

                    if (!list || list.length === 0) {
                        emptyMsg.classList.remove('hidden');
                        return;
                    }
                    emptyMsg.classList.add('hidden');

                    list.forEach(function(u) {
                        const tr = document.createElement('tr');
                        tr.className = 'border-b border-white/10';
                        tr.setAttribute('data-user-id', String(u.id));
                        tr.innerHTML = rowHtml(u);
                        tbody.appendChild(tr);

                        const select = tr.querySelector('.nivel-select');
                        const btnAprovar = tr.querySelector('.btn-aprovar');
                        const btnSalvar = tr.querySelector('.btn-salvar');
                        const btnExcluir = tr.querySelector('.btn-excluir');

                        if (btnAprovar) {
                            btnAprovar.addEventListener('click', function() {
                                const nivel = parseInt(select.value, 10);
                                aprovar(u.id, nivel, btnAprovar);
                            });
                        }
                        if (btnSalvar) {
                            btnSalvar.addEventListener('click', function() {
                                const nivel = parseInt(select.value, 10);
                                atualizarNivel(u.id, nivel, btnSalvar);
                            });
                        }
                        if (btnExcluir) {
                            btnExcluir.addEventListener('click', function() {
                                excluirUsuario(u.id, u.nome || u.email || ('ID ' + u.id), btnExcluir);
                            });
                        }
                    });
                } catch (_) {
                    document.getElementById('loading').classList.add('hidden');
                    showMessage('Erro ao carregar usuários.', true);
                }
            }

            async function aprovar(userId, nivel, btnEl) {
                btnEl.disabled = true;
                btnEl.textContent = '...';
                try {
                    const res = await fetch(base + '/auth/aprovar/' + userId, {
                        method: 'PATCH',
                        headers: headers(),
                        body: JSON.stringify({ nivelPermissao: nivel })
                    });
                    const data = await res.json().catch(function() { return {}; });
                    if (!res.ok) throw new Error(data.detail || 'Erro ao aprovar usuário');
                    showMessage(data.message || 'Usuário aprovado com sucesso.', false);
                    loadUsuarios();
                } catch (e) {
                    showMessage(e.message || 'Erro ao aprovar usuário.', true);
                    btnEl.disabled = false;
                    btnEl.textContent = 'Aprovar';
                }
            }

            async function atualizarNivel(userId, nivel, btnEl) {
                btnEl.disabled = true;
                btnEl.textContent = '...';
                try {
                    const res = await fetch(base + '/auth/usuarios/' + userId + '/nivel', {
                        method: 'PATCH',
                        headers: headers(),
                        body: JSON.stringify({ nivelPermissao: nivel })
                    });
                    const data = await res.json().catch(function() { return {}; });
                    if (!res.ok) throw new Error(data.detail || 'Erro ao atualizar nível');
                    showMessage(data.message || 'Nível atualizado com sucesso.', false);
                    loadUsuarios();
                } catch (e) {
                    showMessage(e.message || 'Erro ao atualizar nível.', true);
                    btnEl.disabled = false;
                    btnEl.textContent = 'Salvar nível';
                }
            }

            async function excluirUsuario(userId, userName, btnEl) {
                const ok = window.confirm('Tem certeza que deseja excluir o usuário "' + userName + '"?');
                if (!ok) return;
                btnEl.disabled = true;
                btnEl.textContent = '...';
                try {
                    const res = await fetch(base + '/auth/usuarios/' + userId, {
                        method: 'DELETE',
                        headers: headers()
                    });
                    const data = await res.json().catch(function() { return {}; });
                    if (!res.ok) throw new Error(data.detail || 'Erro ao excluir usuário');
                    showMessage(data.message || 'Usuário excluído com sucesso.', false);
                    loadUsuarios();
                } catch (e) {
                    showMessage(e.message || 'Erro ao excluir usuário.', true);
                    btnEl.disabled = false;
                    btnEl.textContent = 'Excluir';
                }
            }

            async function init() {
                const user = await window.auth.checkAuth(true);
                if (!user) return;
                if (user.nivelPermissao !== 0 && user.nivelPermissao !== 1) {
                    window.location.href = '/';
                    return;
                }
                currentUser = user;
                loadUsuarios();
            }

            init();
        })();
    </script>
</body>
</html>
