<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo usuário - Gerenciador de Peças</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="config.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                        secondary: { 50: '#f8fafc', 100: '#f1f5f9', 500: '#64748b', 600: '#475569' }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen text-gray-800 relative flex items-center justify-center py-8">
    <div class="fixed inset-0 z-0">
        <img src="imagens/fundoDb.jpg" alt="Fundo" class="w-full h-full object-cover" 
             onerror="this.style.display='none'; this.nextElementSibling.style.background='linear-gradient(135deg, #1e3a8a, #3730a3, #581c87)'">
        <div class="absolute inset-0 bg-black bg-opacity-60"></div>
    </div>

    <div class="relative z-10 w-full max-w-md mx-4">
        <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl shadow-xl p-8">
            <div class="flex justify-center mb-6">
                <div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center">
                    <i class="fas fa-user-plus text-white text-2xl"></i>
                </div>
            </div>
            <h1 class="text-2xl font-bold text-white text-center mb-2">Novo usuário</h1>
            <p class="text-white/80 text-center mb-6 text-sm">Preencha com nome, e-mail corporativo XCMG e senha (mín. 8 caracteres)</p>

            <div id="formError" class="hidden mb-4 p-3 rounded-lg bg-red-500/20 border border-red-400/50 text-red-200 text-sm"></div>
            <div id="formSuccess" class="hidden mb-4 p-3 rounded-lg bg-green-500/20 border border-green-400/50 text-green-200 text-sm"></div>

            <form id="registroForm" class="space-y-4">
                <div>
                    <label for="nome" class="block text-sm font-medium text-white/90 mb-1">Nome</label>
                    <input type="text" id="nome" name="nome" required
                           class="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 text-white placeholder-white/50 focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                           placeholder="Seu nome">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-white/90 mb-1">E-mail corporativo (XCMG)</label>
                    <input type="email" id="email" name="email" required
                           class="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 text-white placeholder-white/50 focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                           placeholder="seu.email@xcmg.com.br">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-white/90 mb-1">Senha (mínimo 8 caracteres)</label>
                    <input type="password" id="password" name="password" required minlength="8"
                           class="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 text-white placeholder-white/50 focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                           placeholder="••••••••">
                </div>
                <button type="submit" id="submitBtn"
                        class="w-full py-3 px-4 bg-primary-500 hover:bg-primary-600 text-white font-semibold rounded-lg transition-colors flex items-center justify-center gap-2">
                    <i class="fas fa-paper-plane"></i> Enviar solicitação
                </button>
            </form>

            <p class="mt-6 text-center text-white/80 text-sm">
                Já tem acesso?
                <a href="/login" class="text-primary-400 hover:text-primary-300 font-medium">Fazer login</a>
            </p>
        </div>
    </div>

    <script>
        (function() {
            const form = document.getElementById('registroForm');
            const errorDiv = document.getElementById('formError');
            const successDiv = document.getElementById('formSuccess');
            const submitBtn = document.getElementById('submitBtn');

            function showError(msg) {
                successDiv.classList.add('hidden');
                errorDiv.textContent = msg;
                errorDiv.classList.remove('hidden');
            }
            function showSuccess(msg) {
                errorDiv.classList.add('hidden');
                successDiv.textContent = msg;
                successDiv.classList.remove('hidden');
            }
            function hideMessages() {
                errorDiv.classList.add('hidden');
                successDiv.classList.add('hidden');
            }

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideMessages();
                const password = document.getElementById('password').value;
                if (password.length < 8) {
                    showError('A senha deve ter no mínimo 8 caracteres.');
                    return;
                }
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';

                const nome = document.getElementById('nome').value.trim();
                const email = document.getElementById('email').value.trim().toLowerCase();
                const base = window.API_BASE_URL || '/api';

                try {
                    const res = await fetch(base + '/auth/registro', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ nome, email, password })
                    });
                    const data = await res.json().catch(function() { return {}; });

                    if (res.ok) {
                        showSuccess('Solicitação enviada aos administradores. Você poderá acessar o sistema após aprovação.');
                        form.reset();
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar solicitação';
                        return;
                    }
                    if (res.status === 409) {
                        showError('Este e-mail já está cadastrado.');
                    } else {
                        showError(data.detail || 'Não foi possível enviar a solicitação. Tente novamente.');
                    }
                } catch (_) {
                    showError('Erro de conexão. Tente novamente.');
                }
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar solicitação';
            });
        })();
    </script>
</body>
</html>
